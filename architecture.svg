<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="grad-user" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad-vue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b3c"/>
      <stop offset="100%" stop-color="#071b26"/>
    </linearGradient>
    <linearGradient id="grad-dotnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1547"/>
      <stop offset="100%" stop-color="#190a2b"/>
    </linearGradient>
    <linearGradient id="grad-db" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063223"/>
      <stop offset="100%" stop-color="#021a12"/>
    </linearGradient>
    <linearGradient id="grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d08"/>
      <stop offset="100%" stop-color="#1f0e03"/>
    </linearGradient>

    <!-- Markers / Arrowheads -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#090d16"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 40)">
    <circle cx="12" cy="18" r="8" fill="#38bdf8"/>
    <text x="32" y="25" font-size="24" font-weight="bold" fill="#f8fafc">Mini ATS — Canonical Architecture &amp; System Path Map</text>
    <text x="32" y="48" font-size="13" font-weight="normal" fill="#94a3b8">Master Blueprint: Vue 3 (Vercel) • .NET 10 &amp; Python FastAPI (Railway) • Supabase Auth &amp; PostgreSQL</text>
  </g>

  <!-- ==================== CONNECTING LINES ==================== -->

  <!-- User -> Vue Frontend -->
  <path d="M 180 340 L 260 340" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  
  <!-- User -> Supabase Auth Direct -->
  <path d="M 120 280 C 120 175, 500 175, 570 175" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrow-teal)"/>
  
  <!-- Supabase Auth -> User JWT return -->
  <path d="M 570 195 C 470 195, 140 210, 140 280" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-teal)"/>

  <!-- Vue Frontend -> .NET Backend -->
  <path d="M 480 370 L 600 370" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

  <!-- .NET Backend -> Supabase DB -->
  <path d="M 720 540 L 720 630" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- .NET Backend -> Python AI -->
  <path d="M 840 370 L 980 370" fill="none" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

  <!-- Python AI -> LLM -->
  <path d="M 1200 370 L 1300 370" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-amber)"/>

  <!-- .NET Backend -> Supabase Auth (Service Role) -->
  <path d="M 680 300 L 680 230" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-purple)"/>

  <!-- ==================== NODES & PANELS ==================== -->

  <!-- NODE 1: USERS -->
  <g transform="translate(60, 280)">
    <rect width="120" height="210" rx="14" fill="url(#grad-user)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="60" cy="45" r="18" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 46 72 A 16 16 0 0 1 74 72" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="60" y="102" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Browser / User</text>
    
    <rect x="18" y="122" width="84" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="60" y="138" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Admin Role</text>
    
    <rect x="18" y="155" width="84" height="24" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="60" y="171" font-size="11" font-weight="bold" fill="#a78bfa" text-anchor="middle">Customer</text>
  </g>

  <!-- CLUSTER 1: FRONTEND (VERCEL) -->
  <g transform="translate(260, 220)">
    <rect width="220" height="320" rx="16" fill="url(#grad-vue)" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="36" rx="16" fill="#0369a1" fill-opacity="0.3"/>
    
    <text x="16" y="24" font-size="11" font-weight="bold" fill="#38bdf8">FRONTEND (VERCEL)</text>
    <text x="16" y="60" font-size="17" font-weight="bold" fill="#f0f9ff">Vue 3 + TS (Vite)</text>
    <text x="16" y="78" font-size="11" fill="#93c5fd">Pinia Stores • Tailwind • Router</text>

    <g transform="translate(14, 95)">
      <rect width="192" height="36" rx="8" fill="#082f49" stroke="#0369a1" stroke-width="1"/>
      <text x="8" y="16" font-size="10" font-weight="bold" fill="#bae6fd">Routes:</text>
      <text x="54" y="16" font-size="10" fill="#e0f2fe">/login, /kanban, /jobs</text>
      <text x="8" y="30" font-size="9.5" fill="#7dd3fc">/candidates, /admin, /dashboard</text>

      <rect y="44" width="192" height="36" rx="8" fill="#082f49" stroke="#0369a1" stroke-width="1"/>
      <text x="8" y="60" font-size="10" font-weight="bold" fill="#bae6fd">Stores:</text>
      <text x="50" y="60" font-size="10" fill="#e0f2fe">auth.ts, ats.ts</text>
      <text x="8" y="73" font-size="9.5" fill="#7dd3fc">ui.ts (theme), ai.ts (reports)</text>

      <rect y="88" width="192" height="36" rx="8" fill="#082f49" stroke="#0369a1" stroke-width="1"/>
      <text x="8" y="104" font-size="10" font-weight="bold" fill="#bae6fd">Key Views:</text>
      <text x="68" y="104" font-size="10" fill="#e0f2fe">KanbanBoard.vue</text>
      <text x="8" y="117" font-size="9.5" fill="#7dd3fc">AiAssessmentPanel.vue</text>

      <rect y="132" width="192" height="42" rx="8" fill="#061e2e" stroke="#0c4a6e" stroke-width="1"/>
      <text x="8" y="148" font-size="9.5" font-weight="bold" fill="#38bdf8">ENV: VITE_SUPABASE_URL</text>
      <text x="8" y="163" font-size="9" fill="#7dd3fc">VITE_API_BASE_URL (Railway)</text>
    </g>
  </g>

  <!-- CLUSTER 2: SUPABASE AUTH -->
  <g transform="translate(570, 120)">
    <rect width="240" height="110" rx="14" fill="#042f2e" stroke="#14b8a6" stroke-width="1.8"/>
    <text x="16" y="24" font-size="11" font-weight="bold" fill="#2dd4bf">IDENTITY &amp; AUTH (SUPABASE)</text>
    <text x="16" y="50" font-size="16" font-weight="bold" fill="#f0fdfa">Supabase Auth API</text>
    <text x="16" y="70" font-size="11" fill="#99f6e4">• signInWithPassword() → JWT Issue</text>
    <text x="16" y="88" font-size="11" fill="#99f6e4">• Admin Users API (Service Role)</text>
  </g>

  <!-- CLUSTER 3: .NET API BACKEND -->
  <g transform="translate(600, 300)">
    <rect width="240" height="240" rx="16" fill="url(#grad-dotnet)" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="34" rx="16" fill="#7e22ce" fill-opacity="0.3"/>
    
    <text x="16" y="23" font-size="11" font-weight="bold" fill="#e9d5ff">CORE BACKEND (RAILWAY)</text>
    <text x="16" y="58" font-size="18" font-weight="bold" fill="#faf5ff">.NET 10 Web API</text>
    <text x="16" y="76" font-size="11" fill="#d8b4fe">Clean Architecture • JWT Auth • DI</text>

    <g transform="translate(14, 92)">
      <rect width="212" height="30" rx="6" fill="#1c0b30" stroke="#7e22ce" stroke-width="1"/>
      <text x="8" y="19" font-size="10.5" fill="#f3e8ff"><tspan font-weight="bold" fill="#c084fc">Middleware:</tspan> CurrentUser, AuthZ</text>

      <rect y="38" width="212" height="42" rx="6" fill="#1c0b30" stroke="#7e22ce" stroke-width="1"/>
      <text x="8" y="54" font-size="10.5" font-weight="bold" fill="#c084fc">Scoped Controllers:</text>
      <text x="8" y="70" font-size="10" fill="#e9d5ff">/api/jobs, /api/candidates, /api/admin</text>

      <rect y="88" width="212" height="42" rx="6" fill="#150724" stroke="#581c87" stroke-width="1"/>
      <text x="8" y="104" font-size="10" font-weight="bold" fill="#a855f7">Security Scoping Enforced:</text>
      <text x="8" y="120" font-size="9" fill="#d8b4fe">Customer: CurrentUser.Id | Admin: Explicit</text>
    </g>
  </g>

  <!-- CLUSTER 4: SUPABASE DATABASE -->
  <g transform="translate(580, 630)">
    <rect width="280" height="220" rx="16" fill="url(#grad-db)" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="34" rx="16" fill="#15803d" fill-opacity="0.3"/>
    
    <text x="16" y="23" font-size="11" font-weight="bold" fill="#86efac">DATABASE (SUPABASE POSTGRES)</text>
    <text x="16" y="58" font-size="17" font-weight="bold" fill="#f0fdf4">PostgreSQL + Row-Level Security</text>

    <g transform="translate(14, 72)">
      <rect width="252" height="40" rx="6" fill="#052419" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="18" font-size="11" font-weight="bold" fill="#4ade80">public.profiles</text>
      <text x="10" y="32" font-size="9.5" fill="#bbf7d0">id (FK auth.users), role ('admin' | 'customer')</text>

      <rect y="46" width="252" height="40" rx="6" fill="#052419" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="64" font-size="11" font-weight="bold" fill="#4ade80">public.jobs</text>
      <text x="10" y="78" font-size="9.5" fill="#bbf7d0">id, customer_id, title, description, status</text>

      <rect y="92" width="252" height="44" rx="6" fill="#052419" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="110" font-size="11" font-weight="bold" fill="#4ade80">public.candidates</text>
      <text x="10" y="125" font-size="9.5" fill="#bbf7d0">stage, ai_score, ai_feedback (JSONB)</text>
    </g>
  </g>

  <!-- CLUSTER 5: AI SERVICE (PYTHON FASTAPI) -->
  <g transform="translate(980, 290)">
    <rect width="220" height="260" rx="16" fill="url(#grad-ai)" stroke="#ea580c" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="34" rx="16" fill="#c2410c" fill-opacity="0.3"/>
    
    <text x="16" y="23" font-size="11" font-weight="bold" fill="#fdba74">AI SUBSYSTEM (RAILWAY)</text>
    <text x="16" y="58" font-size="18" font-weight="bold" fill="#fff7ed">Python FastAPI</text>
    <text x="16" y="76" font-size="11" fill="#fed7aa">Scorer • Analyzer • Mock/LLM</text>

    <g transform="translate(14, 90)">
      <rect width="192" height="42" rx="6" fill="#2a1205" stroke="#ea580c" stroke-width="1"/>
      <text x="8" y="17" font-size="10.5" font-weight="bold" fill="#fb923c">POST /assess</text>
      <text x="8" y="32" font-size="9" fill="#ffedd5">Candidate scoring &amp; CV feedback</text>

      <rect y="50" width="192" height="42" rx="6" fill="#2a1205" stroke="#ea580c" stroke-width="1"/>
      <text x="8" y="67" font-size="10.5" font-weight="bold" fill="#fb923c">POST /analyze</text>
      <text x="8" y="82" font-size="9" fill="#ffedd5">Pipeline bottleneck &amp; health audit</text>

      <rect y="100" width="192" height="42" rx="6" fill="#1c0c03" stroke="#9a3412" stroke-width="1"/>
      <text x="8" y="116" font-size="10" font-weight="bold" fill="#fb923c">Security: Internal Service</text>
      <text x="8" y="131" font-size="9" fill="#fed7aa">Header: X-AI-Service-Key</text>
    </g>
  </g>

  <!-- CLUSTER 6: OPTIONAL EXTERNAL LLM -->
  <g transform="translate(1300, 310)">
    <rect width="180" height="130" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="16" y="28" font-size="11" font-weight="bold" fill="#a5b4fc">EXTERNAL LLM</text>
    <text x="16" y="56" font-size="16" font-weight="bold" fill="#e0e7ff">OpenAI / Claude</text>
    <text x="16" y="80" font-size="11" fill="#c7d2fe">• Optional Provider</text>
    <text x="16" y="98" font-size="11" fill="#c7d2fe">• Deterministic Fallback</text>
  </g>

  <!-- ==================== CONNECTOR LABELS ==================== -->

  <!-- Flow 1: Client to Vue -->
  <rect x="188" y="324" width="60" height="20" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
  <text x="218" y="338" font-size="9.5" font-weight="bold" fill="#7dd3fc" text-anchor="middle">HTTPS</text>

  <!-- Flow 2: Vue to .NET -->
  <rect x="495" y="354" width="94" height="22" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="542" y="369" font-size="9.5" font-weight="bold" fill="#c7d2fe" text-anchor="middle">Bearer JWT</text>

  <!-- Flow 3: .NET to DB -->
  <rect x="730" y="568" width="86" height="22" rx="4" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
  <text x="773" y="583" font-size="9.5" font-weight="bold" fill="#86efac" text-anchor="middle">Npgsql SQL</text>

  <!-- Flow 4: .NET to Python -->
  <rect x="850" y="354" width="118" height="22" rx="4" fill="#2a1205" stroke="#ea580c" stroke-width="1"/>
  <text x="909" y="369" font-size="9.5" font-weight="bold" fill="#fdba74" text-anchor="middle">X-AI-Service-Key</text>

  <!-- Flow 5: .NET to Supabase Auth Admin -->
  <rect x="690" y="248" width="90" height="22" rx="4" fill="#2e1065" stroke="#9333ea" stroke-width="1"/>
  <text x="735" y="263" font-size="9.5" font-weight="bold" fill="#e9d5ff" text-anchor="middle">Service Key</text>

  <!-- Flow 6: Supabase Auth direct -->
  <rect x="250" y="165" width="140" height="20" rx="4" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
  <text x="320" y="179" font-size="9.5" font-weight="bold" fill="#5eead4" text-anchor="middle">signInWithPassword()</text>

  <!-- ==================== FOOTER: SECURITY MATRIX (CLEAN 3-CARD GRID) ==================== -->
  <g transform="translate(60, 875)">
    <!-- Container background -->
    <rect width="1480" height="110" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Title Bar -->
    <text x="24" y="24" font-size="11" font-weight="bold" fill="#94a3b8" letter-spacing="0.05em">SECURITY BOUNDARIES &amp; SCOPING RULES</text>
    
    <!-- Card 1: Public Access -->
    <g transform="translate(24, 34)">
      <rect width="460" height="62" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <circle cx="16" cy="18" r="4.5" fill="#38bdf8"/>
      <text x="28" y="22" font-size="11" font-weight="bold" fill="#38bdf8">Public Boundary</text>
      <text x="16" y="38" font-size="10" fill="#94a3b8">Strictly limited to /login and /health.</text>
      <text x="16" y="51" font-size="10" fill="#cbd5e1">Direct browser access to DB is blocked.</text>
    </g>

    <!-- Card 2: Tenant Isolation -->
    <g transform="translate(510, 34)">
      <rect width="460" height="62" rx="8" fill="#0f172a" stroke="#7e22ce" stroke-width="1"/>
      <circle cx="16" cy="18" r="4.5" fill="#c084fc"/>
      <text x="28" y="22" font-size="11" font-weight="bold" fill="#c084fc">Tenant Isolation (RLS)</text>
      <text x="16" y="38" font-size="10" fill="#94a3b8">Customer queries strictly scoped to own profile.id.</text>
      <text x="16" y="51" font-size="10" fill="#cbd5e1">Admin must explicitly supply customerId.</text>
    </g>

    <!-- Card 3: Secret Protection -->
    <g transform="translate(996, 34)">
      <rect width="460" height="62" rx="8" fill="#0f172a" stroke="#ea580c" stroke-width="1"/>
      <circle cx="16" cy="18" r="4.5" fill="#fb923c"/>
      <text x="28" y="22" font-size="11" font-weight="bold" fill="#fb923c">Secret Protection</text>
      <text x="16" y="38" font-size="10" fill="#94a3b8">Service Role Key and AI Key remain server-side.</text>
      <text x="16" y="51" font-size="10" fill="#cbd5e1">Never exposed to frontend or Git commits.</text>
    </g>
  </g>
</svg>
